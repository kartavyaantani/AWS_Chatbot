version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - pip install -r requirements.txt
  pre_build:
    commands:
      - python -m unittest discover -s tests -p "test_*.py"
  build:
    commands:
      - chmod +x scripts/package_lambda.sh
      - ./scripts/package_lambda.sh
artifacts:
  files:
    - dist/lambda.zip
    - appspec.yml
